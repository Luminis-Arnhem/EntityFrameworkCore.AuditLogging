# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  - main

variables:
  artifactName: Luminis.EntityFrameworkCore.AuditLogging
stages:
- stage: Build
 
  jobs:
  - job: Build
    displayName: Build the package
    pool:
      vmImage: 'ubuntu-latest'

    variables:
      buildConfiguration: 'Release'
      buildPlatform: 'Any CPU'
      solution: '**/*.sln'

    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET Core SDK 10.0'
      inputs:
        version: 10.x
        includePreviewVersions: true

    - task: gitversion/setup@1
      displayName: Install GitVersion
      inputs:
        versionSpec: 5.x

    - task: gitversion/execute@1
      displayName: Determine Version
                                                                   
    - task: DotNetCoreCLI@2
      displayName: 'dotnet restore'
      inputs:
        command: restore
        projects: "**/*.sln"

    - task: DotNetCoreCLI@2
      displayName: 'dotnet build'
      inputs:
        projects: '**/*.csproj'
        arguments: ' --no-restore --configuration $(BuildConfiguration) /p:AssemblyVersion=$(GitVersion.MajorMinorPatch) /p:Version=$(GitVersion.SemVer)'

    - task: DotNetCoreCLI@2
      displayName: 'dotnet pack'
      inputs:
        command: 'pack'
        packagesToPack: '**/Luminis.EntityFrameworkCore.AuditLogging.csproj'
        configuration: '$(buildConfiguration)'
        versioningScheme: 'byEnvVar'
        versionEnvVar: 'GitVersion.NuGetVersionV2'

    - task: DotNetCoreCLI@2
      displayName: DotnetCore Test
      inputs:
          command: test
          projects: '**/*Tests/*.csproj'
          arguments: '--collect:"Code Coverage"'

    - publish: $(Build.ArtifactStagingDirectory)
      artifact: $(artifactName)
